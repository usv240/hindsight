name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Build distributions
        run: uv build

      # The judge path must work with no Docker, no DataHub, no network and no
      # LLM. Running it in CI proves that claim on a clean machine rather than
      # on the author's laptop.
      - name: Judge demo (offline, no DataHub required)
        run: uv run hindsight demo

      # The demo banner and lineage block are printed to stdout. Windows
      # consoles default to CP1252, so any non-ASCII here renders as a
      # replacement character for a judge. Fail the build instead.
      - name: Assert console output is ASCII-only
        run: uv run python scripts/check_ascii_output.py

      - name: Assert JSON deliverables parse strictly
        run: uv run python scripts/check_json_deliverables.py

      # The console claims anyone can read it. That is checkable, so check it:
      # every route, both themes, both reading levels, against WCAG 2.1 AA.
      # One runner is enough - the result is a property of the stylesheet, not
      # of the operating system, and a browser download on every matrix leg
      # would cost more than it proves.
      - name: Accessibility gate on the console
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          uv run --with playwright playwright install --with-deps chromium
          uv run hindsight serve &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8100 > /dev/null && break
            sleep 1
          done
          uv run --with playwright python scripts/check_accessibility.py
