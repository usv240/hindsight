name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      # The judge path must work with no Docker, no DataHub, no network and no
      # LLM. Running it in CI proves that claim on a clean machine rather than
      # on the author's laptop.
      - name: Judge demo (offline, no DataHub required)
        run: uv run hindsight demo

      # The demo banner and lineage block are printed to stdout. Windows
      # consoles default to CP1252, so any non-ASCII here renders as a
      # replacement character for a judge. Fail the build instead.
      - name: Assert console output is ASCII-only
        run: uv run python scripts/check_ascii_output.py

      - name: Assert JSON deliverables parse strictly
        run: uv run python scripts/check_json_deliverables.py
