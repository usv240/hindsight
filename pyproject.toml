[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "datahub-hindsight"
version = "0.1.0"
description = "Evidence-based ML release gate for temporal and target leakage using DataHub lineage."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hindsight contributors" }]
dependencies = [
    "duckdb>=1.3,<2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.6,<2",
    "sqlglot==30.12.0",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
datahub = [
    "acryl-datahub>=1.3,<2",
    "datahub-agent-context>=1.5,<2",
    "mcp-server-datahub>=0.5,<1",
    "sqlparse>=0.5,<1",
]

actions = [
    "acryl-datahub-actions>=0.1,<1",
]

[project.scripts]
hindsight = "hindsight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]
